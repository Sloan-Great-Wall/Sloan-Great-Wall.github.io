<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="5; url=https://sloangw.com/" />
    <link rel="canonical" href="https://sloangw.com/" />
    <meta
      name="description"
      content="Static GitHub Pages pointer to the canonical Sloan GW website at sloangw.com."
    />
    <title>Sloan GW Pointer</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #101015;
        --fg: #f5f2ea;
        --muted: #b7b2aa;
        --line: rgba(255, 255, 255, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .pointer {
        width: min(720px, calc(100vw - 48px));
        border-top: 1px solid var(--line);
        padding-top: 32px;
      }

      h1 {
        margin: 0;
        font-size: clamp(48px, 11vw, 108px);
        line-height: 0.94;
        letter-spacing: 0;
      }

      p {
        margin: 20px 0 0;
        max-width: 560px;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.5;
      }

      a {
        color: inherit;
        text-underline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <div class="pointer" role="main">
      <h1>Sloan GW</h1>
      <p>
        This GitHub Pages site is a static pointer. Redirecting to the canonical
        Sloan GW website at <a href="https://sloangw.com/">sloangw.com</a>.
      </p>
    </div>
  </body>
</html>
